<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie — Rachid·</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0a0a;
      --bg-alt:      #080808;
      --gold:        #C9A96E;
      --white:       #FFFFFF;
      --text:        rgba(255,255,255,0.82);
      --text-mute:   rgba(255,255,255,0.45);
      --border:      rgba(255,255,255,0.06);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  'DM Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    /* ── HEADER ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 64px;
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
    }
    .logo-img-header { height: 54px; width: auto; display: block; }
    .back-link {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-mute);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--gold); }
    .back-link::before { content: '←'; font-size: 12px; }

    /* ── HERO ── */
    .page-hero {
      padding: 64px 64px 48px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }
    .page-title {
      font-family: var(--serif);
      font-size: 52px;
      font-weight: 300;
      color: var(--white);
      line-height: 1.05;
    }
    .page-title em { font-style: italic; color: var(--gold); }

    /* ── GRILLE ── */
    .gallery-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .gallery-item {
      overflow: hidden;
      cursor: pointer;
      line-height: 0;
    }
    .gallery-item img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img { transform: scale(1.03); }
    .gallery-text-card {
      overflow: hidden;
      position: relative;
      display: block;
      text-decoration: none;
      line-height: 0;
    }
    .gallery-text-card::after {
      content: '';
      display: block;
      padding-top: 100%;
    }
    .gtc-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(201,169,110,0.05);
      border: 0.5px solid rgba(201,169,110,0.25);
      transition: background 0.3s, border-color 0.3s;
    }
    .gallery-text-card:hover .gtc-inner {
      background: rgba(201,169,110,0.1);
      border-color: rgba(201,169,110,0.55);
    }
    .gtc-inner p {
      font-family: 'DM Serif Display', serif;
      font-size: 13px;
      font-weight: 300;
      font-style: italic;
      color: #C9A96E;
      line-height: 1.75;
      text-align: center;
    }
    @media (min-width: 768px) {
      .gtc-inner p { font-size: 20px; }
    }

    /* ── LIGHTBOX ── */
    .lb-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .lb-overlay.active { display: flex; }
    .lb-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 28px;
      cursor: pointer;
      z-index: 10;
      line-height: 1;
      transition: color 0.2s;
    }
    .lb-close:hover { color: var(--gold); }
    .lb-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .lb-img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      user-select: none;
      touch-action: none;
      transform-origin: center center;
      cursor: default;
      will-change: transform;
    }

    /* ── FOOTER ── */
    .page-footer {
      background: var(--bg-alt, #080808);
      border-top: 0.5px solid var(--border);
      padding: 32px 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-copy { font-size: 11px; color: var(--text-mute); }
    .footer-copy span { color: var(--gold); }
    .footer-back {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-mute);
      transition: color 0.3s;
    }
    .footer-back:hover { color: var(--gold); }

    /* ── RESPONSIVE ── */
    @media (min-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
    }
    @media (max-width: 768px) {
      .header { padding: 10px 20px; }
      .logo-img-header { height: 44px; }
      .page-hero { padding: 40px 20px 32px; }
      .page-title { font-size: 36px; }
      .gallery-wrap { padding: 0 12px 60px; }
      .page-footer { flex-direction: column; gap: 12px; text-align: center; padding: 24px 20px; }
    }
  </style>
</head>

  </footer>

  <script>
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lbImg');
    const lbClose = document.getElementById('lbClose');
    const lbCont  = document.getElementById('lbContainer');

    const items = Array.from(document.querySelectorAll('.gallery-item'));
    let currentIndex = 0;

    let scale = 1, posX = 0, posY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;
    let startDist = 0, startScale = 1;
    let lastTouchX = 0, lastTouchY = 0;
    let swipeStartX = 0, swipeStartY = 0;

    function applyTransform() {
      lbImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
      lbImg.style.cursor = scale > 1 ? 'grab' : 'default';
    }

    function resetZoom() {
      scale = 1; posX = 0; posY = 0;
      applyTransform();
    }

    function getDist(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    function showPhoto(i) {
      currentIndex = i;
      resetZoom();
      lbImg.src = items[i].querySelector('img').src;
    }

    function showNext() { showPhoto((currentIndex + 1) % items.length); }
    function showPrev() { showPhoto((currentIndex - 1 + items.length) % items.length); }

    /* ── MOBILE : touch ── */
    lbImg.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        startDist  = getDist(e.touches[0], e.touches[1]);
        startScale = scale;
      } else if (e.touches.length === 1) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
        lastTouchX  = e.touches[0].clientX;
        lastTouchY  = e.touches[0].clientY;
        isDragging  = scale > 1;
      }
    }, { passive: true });

    lbImg.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 2) {
        const dist = getDist(e.touches[0], e.touches[1]);
        scale = Math.min(Math.max(startScale * (dist / startDist), 1), 6);
        applyTransform();
      } else if (e.touches.length === 1 && isDragging) {
        posX += e.touches[0].clientX - lastTouchX;
        posY += e.touches[0].clientY - lastTouchY;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        applyTransform();
      }
    }, { passive: false });

    lbImg.addEventListener('touchend', e => {
      if (e.changedTouches.length === 1 && scale <= 1.05) {
        const dx = e.changedTouches[0].clientX - swipeStartX;
        const dy = e.changedTouches[0].clientY - swipeStartY;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
          dx < 0 ? showNext() : showPrev();
          return;
        }
      }
      if (e.touches.length === 0) isDragging = false;
      if (scale < 1.05) resetZoom();
    });

    /* ── DESKTOP : molette + drag ── */
    lbCont.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.9;
      scale = Math.min(Math.max(scale * factor, 1), 6);
      if (scale === 1) { posX = 0; posY = 0; }
      applyTransform();
    }, { passive: false });

    lbImg.addEventListener('mousedown', e => {
      if (scale > 1) {
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
        lbImg.style.cursor = 'grabbing';
        e.preventDefault();
      }
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        lbImg.style.cursor = scale > 1 ? 'grab' : 'default';
      }
    });

    /* ── OUVERTURE / FERMETURE ── */
    items.forEach((item, i) => {
      item.addEventListener('click', () => {
        currentIndex = i;
        resetZoom();
        lbImg.src = item.querySelector('img').src;
        lb.classList.add('active');
        document.body.style.overflow = 'hidden';
        history.pushState({ lightbox: true }, '');
      });
    });

    function closeLb() {
      if (!lb.classList.contains('active')) return;
      lb.classList.remove('active');
      lbImg.src = '';
      document.body.style.overflow = '';
      resetZoom();
      if (history.state && history.state.lightbox) history.back();
    }

    /* bouton retour téléphone → ferme la lightbox au lieu de quitter la page */
    window.addEventListener('popstate', () => {
      if (lb.classList.contains('active')) {
        lb.classList.remove('active');
        lbImg.src = '';
        document.body.style.overflow = '';
        resetZoom();
      }
    });

    lbClose.addEventListener('click', closeLb);
    lb.addEventListener('click', e => { if (e.target === lb || e.target === lbCont) closeLb(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape')     closeLb();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft')  showPrev();
    });
  </script>
