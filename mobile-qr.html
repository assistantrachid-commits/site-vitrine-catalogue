<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-192x192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouvrir sur mobile — Rachid·</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: rgba(255,255,255,0.82);
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .card {
      background: #101010;
      border: 0.5px solid rgba(201,169,110,0.25);
      padding: 48px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .logo {
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: 300;
      color: #fff;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .logo span { color: #C9A96E; }
    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 36px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    #qrcode canvas, #qrcode img {
      border: 6px solid #fff;
    }
    .url {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .url strong {
      display: block;
      color: #C9A96E;
      font-size: 15px;
      font-weight: 500;
      margin-top: 6px;
      word-break: break-all;
    }
    .note {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 24px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">Rachid<span>·</span></p>
    <p class="eyebrow">Aperçu mobile</p>
    <div id="qrcode"></div>
    <p class="url">
      Scanne ce QR code avec ton téléphone
      <strong>http://192.168.1.24:8080</strong>
    </p>
    <p class="note">Ton téléphone doit être connecté au même Wi-Fi.<br>Le serveur tourne sur ce PC.</p>
  </div>

  <script>
    new QRCode(document.getElementById('qrcode'), {
      text: 'http://192.168.1.24:8080',
      width: 220,
      height: 220,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
